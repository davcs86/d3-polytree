name: Release

# On every push to main, Changesets either opens/updates a "Version Packages" PR
# (when unreleased changesets are present) or, once that PR is merged and the
# versions are bumped, publishes the changed @d3-polytree/* packages to npm.
#
# Hybrid auth, chosen per package by scripts/publish.mjs:
#   - New packages (never published) can't use Trusted Publishing yet — a
#     Trusted Publisher can only be configured on npmjs.com after the package
#     exists — so their first version is published with the NPM_TOKEN secret.
#   - Existing packages are published tokenlessly via npm Trusted Publishing
#     (OIDC): GitHub's OIDC identity is exchanged for a short-lived npm
#     credential at publish time, with no long-lived token involved.
# The two phases are isolated: NPM_TOKEN is injected only into the bootstrap
# subprocess, so the OIDC phase always runs without a token. Requirements:
#   - `id-token: write` permission (below) — the OIDC token.
#   - `registry-url` on setup-node — writes the .npmrc used by BOTH the token
#     publish (NODE_AUTH_TOKEN) and the OIDC exchange.
#   - Node >= 22.14 — OIDC support in the toolchain.
#   - pnpm 10 — performs the OIDC exchange natively via npm-registry-fetch
#     (pnpm 9 predates it; pnpm 11 has a known OIDC 404 regression). The version
#     comes from the repo's `packageManager` field, which pnpm/action-setup reads.
#   - `NPM_TOKEN` repository secret — an npm automation/granular token with
#     publish rights on the @d3-polytree scope. Only used to bootstrap brand-new
#     packages; releases that touch only existing packages never read it.
#   - Each existing package must have a Trusted Publisher configured on
#     npmjs.com pointing at this repo + workflow file `release.yml` (a one-time,
#     per-package setup on the npm side; do it right after a package's first,
#     token-based publish so subsequent releases go tokenless).
on:
  push:
    branches: [main]

# Never let two releases run concurrently against the same branch.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit / tags
  pull-requests: write # open the Version Packages PR
  id-token: write # mint the OIDC token for Trusted Publishing

jobs:
  release:
    name: version · publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # The OIDC token exchange for Trusted Publishing runs through the npm CLI,
      # which must be >= 11.5.1. Node 22 ships npm 10.x, so upgrade it here or the
      # exchange yields no credential and the publish 404s (unauthenticated PUT).
      - name: Ensure npm supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: 'Release: version packages'
          commit: 'chore: version packages'
        env:
          # GitHub auth for opening the Version PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bootstrap token for the FIRST publish of a brand-new package. Passed
          # as a plain value (not NODE_AUTH_TOKEN) so it is inert for auth until
          # scripts/publish.mjs injects it into the bootstrap subprocess only;
          # the OIDC phase runs without it. Existing-package releases ignore it.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
