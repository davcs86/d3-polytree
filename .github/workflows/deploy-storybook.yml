name: Deploy Storybook

# Builds the static Storybook (the docs / visual baseline site) and deploys it to
# GitHub Pages on every push to main. Pages must be enabled with "Source: GitHub
# Actions" once, under Settings → Pages. The published site lives at
# https://davcs86.github.io/d3-polytree/.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for a Pages deployment via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish (don't cancel a
# live deploy), but coalesce queued ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Stories import the components' compiled dist/CSS, so build the packages
      # before Storybook (mirrors the CI ordering).
      - name: Build packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storybook/storybook-static

  deploy:
    name: deploy to github pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
