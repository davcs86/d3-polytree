name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lint · typecheck · test · build · storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify generated files are up to date
        # Run each generator itself (not just rely on Build) so a turbo cache hit
        # can never mask a stale committed *.generated.ts. Runs after Build so the
        # style generator can read the upstream compiled dist/style.css.
        run: |
          node packages/pfdn-moddle/scripts/generate-pfdn.mjs
          node packages/icons-amazon/scripts/generate-icons.mjs
          node packages/element/scripts/generate-styles.mjs
          git diff --exit-code -- \
            packages/pfdn-moddle/src/pfdn.generated.ts \
            packages/icons-amazon/src/icons.generated.ts \
            packages/element/src/styles.generated.ts

      - name: Build Storybook
        run: pnpm build-storybook
